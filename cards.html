<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>卡牌图鉴 — 崩铁 CCG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141a;color:#dde;font:14px/1.6 "Microsoft YaHei",sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:#141820ee;backdrop-filter:blur(12px);border-bottom:1px solid #2b303b;padding:12px 18px}.topline{max-width:1440px;margin:auto;display:flex;align-items:center;gap:12px}.home{color:#8ecdf7;text-decoration:none;font-size:13px}.title{font-size:20px;font-weight:800}.count{margin-left:auto;color:#8896a9;font-size:12px}.filters{max-width:1440px;margin:10px auto 0;display:grid;grid-template-columns:minmax(180px,2fr) repeat(5,minmax(105px,1fr)) auto;gap:8px}.filters input,.filters select,.filters button{min-width:0;background:#202631;color:#dce5f1;border:1px solid #343c49;border-radius:7px;padding:8px 9px}.filters button{cursor:pointer}.filters button:hover{border-color:#6693cc}.grid{max-width:1440px;margin:18px auto;padding:0 18px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}.empty{text-align:center;color:#8792a0;padding:80px 20px;grid-column:1/-1}.catalog-card{--pc:#777;--pcd:#333;position:relative;aspect-ratio:5/7.1;border:3px solid #54606e;border-radius:13px;overflow:hidden;background:linear-gradient(160deg,var(--pcd),#12151c 64%);box-shadow:0 8px 18px #0008;cursor:pointer;transition:.14s transform,.14s border-color;isolation:isolate}.catalog-card:hover,.catalog-card:focus{transform:translateY(-4px);border-color:var(--pc);outline:0}.catalog-card.q虹{border-color:#d6a84b}.catalog-card.q金{border-color:#c6a645}.catalog-card.q银{border-color:#aeb7c4}.catalog-card.q铜{border-color:#9b6c4b}.catalog-card.token{border-style:dashed}.art{position:absolute;inset:0 0 31%;width:100%;height:69%;object-fit:cover;object-position:center 22%;z-index:-1}.catalog-card:after{content:"";position:absolute;inset:45% 0 0;z-index:-1;background:linear-gradient(transparent,var(--pcd) 20%,#151820 62%)}.cost,.atk,.hp,.cd{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:900;text-shadow:0 1px 3px #000}.cost{left:6px;top:6px;width:35px;height:35px;background:radial-gradient(circle at 35% 30%,var(--pc),var(--pcd));border:2px solid #d8e9ff}.atk,.hp,.cd{bottom:5px;width:35px;height:35px;border:2px solid #ffe4bb}.atk{left:6px;background:#a74e22}.hp{right:6px;background:#a82e42}.cd{right:6px;background:#6048a6}.cname{position:absolute;left:8px;right:8px;top:51%;font-size:14px;font-weight:800;text-align:center;text-shadow:0 2px 4px #000}.effect{position:absolute;left:9px;right:9px;top:59%;bottom:39px;overflow:hidden;color:#d6dce6;font-size:11px;line-height:1.45}.subtype{position:absolute;left:42px;right:42px;bottom:8px;text-align:center;color:#99a6b7;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.class-chip{position:absolute;right:5px;top:6px;padding:2px 6px;border-radius:10px;background:#111b;color:#dce6f3;font-size:9px}.more{display:block;margin:-22px auto 40px;padding:10px 30px;border:1px solid #384354;border-radius:8px;background:#202631;color:#dce5f1;cursor:pointer}.more[hidden]{display:none}.shade{display:none;position:fixed;inset:0;z-index:20;background:#05070bcc;align-items:center;justify-content:center;padding:18px}.shade.on{display:flex}.detail{width:min(820px,96vw);max-height:92vh;overflow:auto;background:#1a1f29;border:1px solid #3a4657;border-radius:14px;box-shadow:0 24px 80px #000;position:relative}.close{position:absolute;z-index:3;right:10px;top:10px;width:34px;height:34px;border:0;border-radius:50%;background:#151922dd;color:#fff;font-size:22px;cursor:pointer}.hero{height:340px;position:relative;overflow:hidden;border-radius:14px 14px 0 0;background:#10131a}.hero .blur{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(22px) brightness(.55)}.hero .full{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat}.hero:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#1a1f29)}.hero-title{position:absolute;z-index:2;left:22px;right:58px;bottom:15px}.hero-title h2{margin:0;font-size:25px}.hero-title div{color:#a9b4c4}.body{padding:14px 22px 24px}.stats,.decks,.chain{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#252c38;border:1px solid #343f4e;border-radius:7px;padding:4px 10px;font-size:12px}.text{background:#222936;border-radius:9px;padding:12px 14px;white-space:pre-wrap}.section-title{font-size:12px;color:#8fa0b5;margin:14px 0 6px}.chain button{border:1px solid #4a5570;background:#252c38;color:#dde;border-radius:8px;padding:7px 10px;cursor:pointer}.chain button.on{border-color:#bf7ce6;color:#efcfff}.token-note{color:#ffd27b;margin-top:10px;font-size:12px}@media(max-width:780px){.top{padding:10px}.topline{gap:8px}.title{font-size:17px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 8px 34px}.catalog-card{border-width:2px}.effect{font-size:9px}.cname{font-size:12px}.detail{width:96vw}.hero{height:250px}.hero-title h2{font-size:20px}.body{padding:12px}.count{font-size:10px}}
</style>
</head>
<body>
<header class="top"><div class="topline"><a class="home" href="index.html">← 返回首页</a><div class="title">卡牌图鉴</div><div id="count" class="count">加载中…</div></div><div class="filters">
<input id="search" class="search" placeholder="搜索名称、效果、标签或牌组">
<select id="class"><option value="">全部职业</option></select>
<select id="type"><option value="">全部类型</option><option>随从</option><option>法术</option><option>护符</option></select>
<select id="cost"><option value="">全部费用</option><option value="1">1费</option><option value="2">2费</option><option value="3">3费</option><option value="4">4费</option><option value="5">5费</option><option value="6">6费</option><option value="7">7费</option><option value="8">8费</option><option value="9+">9费及以上</option></select>
<select id="quality"><option value="">全部稀有度</option><option>铜</option><option>银</option><option>金</option><option>虹</option><option value="衍生">衍生卡</option></select>
<select id="sort"><option value="default">默认排序</option><option value="cost">费用升序</option><option value="name">名称排序</option></select>
<button id="clear">清除条件</button></div></header>
<main id="grid" class="grid"></main><button id="more" class="more" hidden>显示更多</button>
<div id="shade" class="shade"><section id="detail" class="detail" role="dialog" aria-modal="true"></section></div>
<script type="module">
import { loadCards, CLASS_FILES } from './src/loader.js';
import { esc, staticCardHTML } from './src/card-view.js';
const $=id=>document.getElementById(id);let cards=[],byId={},filtered=[],shown=0,current=null;const PAGE=60;
const classOrder=new Map(CLASS_FILES.map(([c],i)=>[c,i]));
function readQuery(){const q=new URLSearchParams(location.search);for(const id of['search','class','type','cost','quality','sort'])if(q.has(id))$(id).value=q.get(id)}
function writeQuery(){const q=new URLSearchParams;for(const id of['search','class','type','cost','quality','sort']){const v=$(id).value;if(v&&!(id==='sort'&&v==='default'))q.set(id,v)}history.replaceState(null,'',location.pathname+(q.size?'?'+q:''))}
function matches(c){const word=$('search').value.trim().toLowerCase(),cost=$('cost').value;if(word&&!`${c.name} ${c.note} ${c.tag} ${c.class} ${c.decks}`.toLowerCase().includes(word))return false;if($('class').value&&c.class!==$('class').value)return false;if($('type').value&&c.type!==$('type').value)return false;if($('quality').value&&($('quality').value==='衍生'?!c.isToken:c.quality!==$('quality').value))return false;if(cost&&(cost==='9+'?c.cost<9:String(c.cost)!==cost))return false;return true}
function compare(a,b){const mode=$('sort').value;if(mode==='name')return a.name.localeCompare(b.name,'zh-CN');if(mode==='cost')return a.cost-b.cost||a.name.localeCompare(b.name,'zh-CN');return(classOrder.get(a.class)-classOrder.get(b.class))||a.id.localeCompare(b.id,undefined,{numeric:true})}
function filter(){writeQuery();filtered=cards.filter(matches).sort(compare);shown=0;$('grid').innerHTML='';append();$('count').textContent=`${filtered.length} / ${cards.length} 张`;}
function append(){const next=filtered.slice(shown,shown+PAGE);$('grid').insertAdjacentHTML('beforeend',next.map(c=>staticCardHTML(c,{showClass:true})).join(''));shown+=next.length;$('more').hidden=shown>=filtered.length;if(!filtered.length)$('grid').innerHTML='<div class="empty">没有符合条件的卡牌</div>';bindCards()}
function bindCards(){for(const el of document.querySelectorAll('.catalog-card:not([data-bound])')){el.dataset.bound='1';const open=()=>show(el.dataset.cardId);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}}}
function detailHTML(def){const url=encodeURI(def.img||''),stats=[`费用 ${def.cost}`];if(def.type==='随从')stats.push(`攻击 ${def.atk}`,`生命 ${def.hp}`);else if(def.countdown)stats.push(`倒数 ${def.countdown}`);const decks=String(def.decks||'').split('/').filter(Boolean);const forms=def.characterId?cards.filter(c=>c.characterId===def.characterId).sort((a,b)=>a.formTier-b.formTier):[];return `<button class="close" aria-label="关闭">×</button><div class="hero">${url?`<div class="blur" style="background-image:url('${url}')"></div><div class="full" style="background-image:url('${url}')"></div>`:''}<div class="hero-title"><h2>${esc(def.name)}</h2><div>${esc(def.class)}　${esc(def.quality)}　${esc(def.type)}${def.tag?'　'+esc(def.tag):''}</div></div></div><div class="body"><div class="stats">${stats.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="text">${esc(def.note||'（无特殊效果）')}</div>${def.isToken?'<div class="token-note">衍生卡，不可直接放入构筑。</div>':''}<div class="section-title">所属预设牌组</div><div class="decks">${decks.length?decks.map(x=>`<span class="pill">${esc(def.class)}｜${esc(x)}</span>`).join(''):'<span class="pill">无预设牌组归属</span>'}</div>${forms.length?`<div class="section-title">换装链</div><div class="chain">${forms.map(x=>`<button data-form="${esc(x.id)}" class="${x.id===def.id?'on':''}">${x.formTier}阶 · ${esc(x.name)}${x.formTier>1?`（替换${x.replaceCost}）`:''}${x.formTier===3?`（跨阶${x.crossTierCost}）`:''}</button>`).join('')}</div>`:''}</div>`}
function show(id){const def=byId[id];if(!def)return;current=id;$('detail').innerHTML=detailHTML(def);$('shade').classList.add('on');document.body.style.overflow='hidden';$('detail').querySelector('.close').onclick=close;for(const b of $('detail').querySelectorAll('[data-form]'))b.onclick=()=>show(b.dataset.form)}
function close(){$('shade').classList.remove('on');document.body.style.overflow='';current=null}
$('shade').onclick=e=>{if(e.target===$('shade'))close()};addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('more').onclick=append;$('clear').onclick=()=>{for(const id of['search','class','type','cost','quality'])$(id).value='';$('sort').value='default';filter()};for(const id of['class','type','cost','quality','sort'])$(id).onchange=filter;let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(filter,120)};
try{const loaded=await loadCards('ALL');cards=loaded.all;byId=loaded.byId;$('class').insertAdjacentHTML('beforeend',CLASS_FILES.map(([c])=>`<option>${esc(c)}</option>`).join(''));readQuery();filter();window.__catalog={get total(){return cards.length},get filtered(){return filtered.length},show,filter};}catch(e){$('grid').innerHTML=`<div class="empty">图鉴加载失败：${esc(e.message)}</div>`;$('count').textContent='加载失败'}
</script>
</body></html>
