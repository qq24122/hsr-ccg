<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<link rel="stylesheet" href="src/card-view.css">
<title>卡牌图鉴 — 崩铁 CCG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11141a;color:#dde;font:14px/1.6 "Microsoft YaHei",sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:#141820ee;backdrop-filter:blur(12px);border-bottom:1px solid #2b303b;padding:12px 18px}.topline{max-width:1440px;margin:auto;display:flex;align-items:center;gap:12px}.home{color:#8ecdf7;text-decoration:none;font-size:13px}.title{font-size:20px;font-weight:800}.count{margin-left:auto;color:#8896a9;font-size:12px}.filters{max-width:1440px;margin:10px auto 0;display:grid;grid-template-columns:minmax(180px,2fr) repeat(6,minmax(105px,1fr)) auto;gap:8px}.filters input,.filters select,.filters button{min-width:0;background:#202631;color:#dce5f1;border:1px solid #343c49;border-radius:7px;padding:8px 9px}.filters button{cursor:pointer}.grid{max-width:1440px;margin:18px auto;padding:0 18px 40px;display:grid;grid-template-columns:repeat(auto-fill,178px);justify-content:center;gap:14px}.empty{text-align:center;color:#8792a0;padding:80px 20px;grid-column:1/-1}.more{display:block;margin:-22px auto 40px;padding:10px 30px;border:1px solid #384354;border-radius:8px;background:#202631;color:#dce5f1;cursor:pointer}.more[hidden]{display:none}.shade{display:none;position:fixed;inset:0;z-index:20;background:#05070bcc;align-items:center;justify-content:center;padding:18px}.shade.on{display:flex}.detail{width:min(820px,96vw);max-height:92vh;overflow:auto;background:#1a1f29;border:1px solid #3a4657;border-radius:14px;box-shadow:0 24px 80px #000;position:relative}.close{position:absolute;z-index:3;right:10px;top:10px;width:34px;height:34px;border:0;border-radius:50%;background:#151922dd;color:#fff;font-size:22px;cursor:pointer}.hero{height:340px;position:relative;overflow:hidden;border-radius:14px 14px 0 0;background:#10131a}.hero .blur{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(22px) brightness(.55)}.hero .full{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat}.hero:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#1a1f29)}.hero-title{position:absolute;z-index:2;left:22px;right:58px;bottom:15px}.hero-title h2{margin:0;font-size:25px}.hero-title div{color:#a9b4c4}.body{padding:14px 22px 24px}.stats,.decks,.chain{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#252c38;border:1px solid #343f4e;border-radius:7px;padding:4px 10px;font-size:12px}.text{background:#222936;border-radius:9px;padding:12px 14px;white-space:pre-wrap}.section-title{font-size:12px;color:#8fa0b5;margin:14px 0 6px}.chain button{border:1px solid #4a5570;background:#252c38;color:#dde;border-radius:8px;padding:7px 10px;cursor:pointer}.chain button.on{border-color:#bf7ce6;color:#efcfff}.token-note{color:#ffd27b;margin-top:10px;font-size:12px}@media(max-width:780px){.top{padding:10px}.topline{gap:8px}.title{font-size:17px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 8px 34px}.detail{width:96vw}.hero{height:250px}.hero-title h2{font-size:20px}.body{padding:12px}.count{font-size:10px}}
</style>
</head>
<body>
<header class="top"><div class="topline"><a class="home" href="index.html">← 返回首页</a><div class="title">卡牌图鉴</div><div id="count" class="count">加载中…</div></div><div class="filters">
<input id="search" class="search" placeholder="搜索名称、效果、标签或牌组">
<select id="class"></select><select id="deck"><option value="">全部牌组</option></select>
<select id="type"><option value="">全部类型</option><option>随从</option><option>法术</option><option>护符</option></select>
<select id="cost"><option value="">全部费用</option><option value="1">1费</option><option value="2">2费</option><option value="3">3费</option><option value="4">4费</option><option value="5">5费</option><option value="6">6费</option><option value="7">7费</option><option value="8">8费</option><option value="9+">9费及以上</option></select>
<select id="quality"><option value="">全部稀有度</option><option>铜</option><option>银</option><option>金</option><option>虹</option><option value="衍生">衍生卡</option></select>
<select id="sort"><option value="default">默认排序</option><option value="cost">费用升序</option><option value="name">名称排序</option></select><button id="clear">清除条件</button></div></header>
<main id="grid" class="grid"></main><button id="more" class="more" hidden>显示更多</button><div id="shade" class="shade"><section id="detail" class="detail" role="dialog" aria-modal="true"></section></div>
<script type="module">
import { loadCards, CLASS_FILES, PRESET_IDS, buildDeckFor } from './src/loader.js';
import { makeRng } from './src/state.js';
import { esc, staticCardHTML } from './src/card-view.js';
const $=id=>document.getElementById(id);let cards=[],byId={},filtered=[],shown=0,current=null,copyCounts=new Map;const PAGE=60;
const classes=CLASS_FILES.map(([c])=>c),classOrder=new Map(classes.map((c,i)=>[c,i])),fileByClass=new Map(CLASS_FILES),classCache=new Map;
const decksByClass=Object.fromEntries(classes.map(cls=>[cls,Object.keys(PRESET_IDS).filter(k=>k.startsWith(cls+'｜')).map(k=>k.split('｜')[1])]));
function rebuildDecks(wanted=''){const names=decksByClass[$('class').value]||[];$('deck').innerHTML='<option value="">全部牌组</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');$('deck').value=names.includes(wanted)?wanted:''}
function readQuery(){const q=new URLSearchParams(location.search),cls=q.get('class');$('class').value=classes.includes(cls)?cls:'毁灭';rebuildDecks(q.get('deck')||'');for(const id of['search','type','cost','quality','sort'])if(q.has(id))$(id).value=q.get(id)}
function writeQuery(){const q=new URLSearchParams;q.set('class',$('class').value);for(const id of['deck','search','type','cost','quality','sort']){const v=$(id).value;if(v&&!(id==='sort'&&v==='default'))q.set(id,v)}history.replaceState(null,'',location.pathname+'?'+q)}
async function loadSelectedClass(){const cls=$('class').value;$('count').textContent='加载中…';$('grid').innerHTML='';let loaded=classCache.get(cls);if(!loaded){loaded=await loadCards(fileByClass.get(cls));classCache.set(cls,loaded)}cards=loaded.all;byId=loaded.byId}
function selectedPool(){copyCounts=new Map;const cls=$('class').value,deck=$('deck').value;if(!deck)return cards.filter(c=>c.class===cls);const all={all:cards,byId,byName:Object.fromEntries(cards.map(c=>[c.name,c]))},forty=buildDeckFor(all,cls,deck,makeRng(1));for(const c of forty)copyCounts.set(c.id,(copyCounts.get(c.id)||0)+1);return[...copyCounts.keys()].map(id=>byId[id])}
function matches(c){const word=$('search').value.trim().toLowerCase(),cost=$('cost').value;if(word&&!`${c.name} ${c.note} ${c.tag} ${c.class} ${c.decks}`.toLowerCase().includes(word))return false;if($('type').value&&c.type!==$('type').value)return false;if($('quality').value&&($('quality').value==='衍生'?!c.isToken:c.quality!==$('quality').value))return false;if(cost&&(cost==='9+'?c.cost<9:String(c.cost)!==cost))return false;return true}
function compare(a,b){const mode=$('sort').value;if(mode==='name')return a.name.localeCompare(b.name,'zh-CN');if(mode==='cost')return a.cost-b.cost||a.name.localeCompare(b.name,'zh-CN');return(classOrder.get(a.class)-classOrder.get(b.class))||a.id.localeCompare(b.id,undefined,{numeric:true})}
function filter(){writeQuery();const pool=selectedPool();filtered=pool.filter(matches).sort(compare);shown=0;$('grid').innerHTML='';append();const totalCopies=[...copyCounts.values()].reduce((a,b)=>a+b,0);$('count').textContent=$('deck').value?`${totalCopies}张 / ${pool.length}种 · 当前${filtered.length}种`:`${filtered.length} / ${pool.length} 张`}
function append(){const next=filtered.slice(shown,shown+PAGE);$('grid').insertAdjacentHTML('beforeend',next.map(c=>staticCardHTML(c,{copies:copyCounts.get(c.id)||0})).join(''));shown+=next.length;$('more').hidden=shown>=filtered.length;if(!filtered.length)$('grid').innerHTML='<div class="empty">没有符合条件的卡牌</div>';bindCards()}
function bindCards(){for(const el of document.querySelectorAll('.catalog-card:not([data-bound])')){el.dataset.bound='1';const open=()=>show(el.dataset.cardId);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}}}
function detailHTML(def){const url=encodeURI(def.img||''),stats=[`费用 ${def.cost}`];if(def.type==='随从')stats.push(`攻击 ${def.atk}`,`生命 ${def.hp}`);else if(def.countdown)stats.push(`倒数 ${def.countdown}`);const decks=String(def.decks||'').split('/').filter(Boolean),forms=def.characterId?cards.filter(c=>c.characterId===def.characterId).sort((a,b)=>a.formTier-b.formTier):[],copies=copyCounts.get(def.id)||0;return `<button class="close" aria-label="关闭">×</button><div class="hero">${url?`<div class="blur" style="background-image:url('${url}')"></div><div class="full" style="background-image:url('${url}')"></div>`:''}<div class="hero-title"><h2>${esc(def.name)}</h2><div>${esc(def.class)}　${esc(def.quality)}　${esc(def.type)}${def.tag?'　'+esc(def.tag):''}</div></div></div><div class="body"><div class="stats">${stats.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}${copies?`<span class="pill">当前牌组 ×${copies}</span>`:''}</div><div class="text">${esc(def.note||'（无特殊效果）')}</div>${def.isToken?'<div class="token-note">衍生卡，不可直接放入构筑。</div>':''}<div class="section-title">所属预设牌组</div><div class="decks">${decks.length?decks.map(x=>`<span class="pill">${esc(def.class)}｜${esc(x)}</span>`).join(''):'<span class="pill">无预设牌组归属</span>'}</div>${forms.length?`<div class="section-title">换装链</div><div class="chain">${forms.map(x=>`<button data-form="${esc(x.id)}" class="${x.id===def.id?'on':''}">${x.formTier}阶 · ${esc(x.name)}${x.formTier>1?`（替换${x.replaceCost}）`:''}${x.formTier===3?`（跨阶${x.crossTierCost}）`:''}</button>`).join('')}</div>`:''}</div>`}
function show(id){const def=byId[id];if(!def)return;current=id;$('detail').innerHTML=detailHTML(def);$('shade').classList.add('on');document.body.style.overflow='hidden';$('detail').querySelector('.close').onclick=close;for(const b of $('detail').querySelectorAll('[data-form]'))b.onclick=()=>show(b.dataset.form)}function close(){$('shade').classList.remove('on');document.body.style.overflow='';current=null}
$('shade').onclick=e=>{if(e.target===$('shade'))close()};addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('more').onclick=append;$('clear').onclick=()=>{for(const id of['search','type','cost','quality'])$(id).value='';$('sort').value='default';filter()};$('class').onchange=async()=>{rebuildDecks();await loadSelectedClass();filter()};$('deck').onchange=filter;for(const id of['type','cost','quality','sort'])$(id).onchange=filter;let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(filter,120)};
try{const catalogStarted=performance.now();$('class').innerHTML=classes.map(c=>`<option>${esc(c)}</option>`).join('');readQuery();await loadSelectedClass();filter();window.__catalog={get total(){return cards.length},get filtered(){return filtered.length},get copies(){return Object.fromEntries(copyCounts)},get loadMs(){return Math.round(performance.now()-catalogStarted)},show,filter};}catch(e){$('grid').innerHTML=`<div class="empty">图鉴加载失败：${esc(e.message)}</div>`;$('count').textContent='加载失败'}
</script>
</body></html>
