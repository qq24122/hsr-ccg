<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>崩坏平衡诊断</title></head><body><button id="run">运行诊断</button><pre id="out"></pre><script type="module">
import {loadCards,buildDeckFor,listDecks} from '../src/loader.js';import * as S from '../src/state.js';import * as E from '../src/engine.js';import * as AI from '../src/ai.js?v=honkai-ai-4';
let cards;const $=id=>document.getElementById(id);
function one(d0,d1,seed,hSide){const s=S.createGame(d0,d1,seed);s.__cardIndex=cards.byName;s.__tokenIndex=cards.byName;AI.applyMulligan(s,0);AI.applyMulligan(s,1);s.__aiTrace=[];s.__cardTrace=[];let g=0,crash=null;try{while(s.winner==null&&g<80){E.startTurn(s);if(s.winner!=null)break;AI.takeTurn(s,s.active);if(s.winner!=null)break;E.endTurn(s);g++;}}catch(e){crash=e.message}const trace=s.__aiTrace.filter(x=>x.player===hSide);const plays=trace.filter(x=>x.kind==='play-choice'&&x.chosen);const modes={};for(const x of plays)modes[x.mode||'normal']=(modes[x.mode||'normal']||0)+1;const cardPlays=(s.__cardTrace||[]).filter(x=>x.player===hSide&&x.kind==='play');const tiers={};for(const x of cardPlays){const d=cards.byId[x.cardId];const k=d?.formTier?`tier${d.formTier}`:d?.type||'unknown';tiers[k]=(tiers[k]||0)+1}return{winner:s.winner,turn:s.turn,crash,modes,tiers,endHand:s.players[hSide].hand.map(h=>h.def.formTier||0),echoes:s.players[hSide].slots.filter(x=>x.echo).length}}
$('run').onclick=async()=>{run.disabled=true;cards=await loadCards('ALL');const names=listDecks(cards),old=[];for(const cls of ['毁灭','存护丰饶','巡猎','智识','同谐','虚无','欢愉','记忆'])for(const dk of names[cls]||[])old.push({cls,dk,deck:buildDeckFor(cards,cls,dk,S.makeRng(1))});const rows=[];for(const dk of names['崩坏']||[]){const nd=buildDeckFor(cards,'崩坏',dk,S.makeRng(1));let w=0,l=0,c=0,u=0,turns=0;const modes={},tiers={};let highEnd=0;for(const od of old)for(const first of [0,1]){const r=first===0?one(nd,od.deck,17,0):one(od.deck,nd,17,1);if(r.crash)c++;else if(r.winner==null)u++;else if(r.winner===(first===0?0:1))w++;else l++;turns+=r.turn;highEnd+=r.endHand.filter(x=>x>1).length;for(const [k,n]of Object.entries(r.modes))modes[k]=(modes[k]||0)+n;for(const [k,n]of Object.entries(r.tiers))tiers[k]=(tiers[k]||0)+n}rows.push({deck:dk,w,l,u,c,avgTurn:+(turns/48).toFixed(1),modes,tiers,highEnd})}out.textContent=JSON.stringify(rows,null,2);window.__diag=rows;run.disabled=false};</script></body></html>
