<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>崩坏三套内战矩阵</title><style>body{font:14px/1.6 sans-serif;background:#191b22;color:#ddd;margin:24px}pre{white-space:pre-wrap;background:#232631;padding:12px;border-radius:6px}</style></head><body><h1>崩坏三套内战矩阵</h1><p>三组不同牌组，互换先后手，每方向10种子，共120局。</p><div id="status">准备中…</div><pre id="out"></pre><script type="module">
import { loadCards, buildDeckFor, listDecks } from '../src/loader.js';
import * as S from '../src/state.js';
import * as E from '../src/engine.js';
import * as AI from '../src/ai.js';
const statusEl=document.getElementById('status'),outEl=document.getElementById('out');let cards;
function one(a,b,seed){const s=S.createGame(a,b,seed);s.__cardIndex=cards.byName;s.__tokenIndex=cards.byName;AI.applyMulligan(s,0);AI.applyMulligan(s,1);let g=0,crash=null;try{while(s.winner==null&&g<80){E.startTurn(s);if(s.winner!=null)break;AI.takeTurn(s,s.active);if(s.winner!=null)break;E.endTurn(s);g++}}catch(e){crash=e.message}return{winner:s.winner,turn:s.turn,crash}}
async function main(){cards=await loadCards('ALL');const names=listDecks(cards)['崩坏']||[],decks=names.map(name=>({name,deck:buildDeckFor(cards,'崩坏',name,S.makeRng(1))})),byDeck=Object.fromEntries(names.map(n=>[n,{w:0,l:0,u:0,c:0,firstW:0,firstL:0,secondW:0,secondL:0}])),pairs=[];for(let i=0;i<decks.length;i++)for(let j=i+1;j<decks.length;j++){const pair={a:decks[i].name,b:decks[j].name,aW:0,bW:0,u:0,c:0,n:0};for(const first of[0,1])for(let seed=1;seed<=10;seed++){const aSide=first===0?0:1,r=first===0?one(decks[i].deck,decks[j].deck,810000+i*10000+j*1000+first*100+seed*17):one(decks[j].deck,decks[i].deck,810000+i*10000+j*1000+first*100+seed*17),a=byDeck[decks[i].name],b=byDeck[decks[j].name];pair.n++;if(r.crash){pair.c++;a.c++;b.c++;continue}if(r.winner==null){pair.u++;a.u++;b.u++;continue}const aWon=r.winner===aSide;if(aWon){pair.aW++;a.w++;b.l++;if(first===0){a.firstW++;b.secondL++}else{a.secondW++;b.firstL++}}else{pair.bW++;a.l++;b.w++;if(first===0){a.firstL++;b.secondW++}else{a.secondL++;b.firstW++}}}pairs.push(pair)}const rows=names.map(name=>{const r=byDeck[name],pct=(w,l)=>w+l?+(w/(w+l)*100).toFixed(2):0;return{deck:name,wins:r.w,losses:r.l,undecided:r.u,crashes:r.c,total:r.w+r.l+r.u+r.c,winRate:pct(r.w,r.l),firstWinRate:pct(r.firstW,r.firstL),secondWinRate:pct(r.secondW,r.secondL)}});window.__honkaiMirror={rows,pairs};outEl.textContent=JSON.stringify({rows,pairs},null,2);statusEl.textContent='完成'}main().catch(e=>{statusEl.textContent='失败：'+e.message;window.__honkaiMirror={fatal:e.message}});
</script></body></html>
