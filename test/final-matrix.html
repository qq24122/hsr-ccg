<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>崩坏对原命途最终矩阵</title><style>body{font:14px/1.6 sans-serif;background:#191b22;color:#ddd;margin:24px}button{padding:8px 12px;background:#8d4dcc;color:#fff;border:0;border-radius:5px;cursor:pointer}button:disabled{opacity:.55}pre{white-space:pre-wrap;background:#232631;padding:12px;border-radius:6px}</style></head>
<body><h1>崩坏 × 原八命途最终矩阵</h1><p>默认10种子，共1440局；不运行原命途互战或崩坏互战。</p><button id="run">开始最终矩阵</button><label> 每个先后手种子数 <input id="seedCount" type="number" min="1" max="10" value="10" style="width:50px"></label><div id="status"></div><pre id="out"></pre>
<script type="module">
import { loadCards, buildDeckFor, listDecks } from '../src/loader.js?v=roles-2';
import * as S from '../src/state.js';
import * as E from '../src/engine.js';
import * as AI from '../src/ai.js?v=honkai-final-2';

const $ = id => document.getElementById(id);
const runButton = $('run'), statusEl = $('status'), outputEl = $('out'), seedInput = $('seedCount');
let cards;

function one(a, b, seed) {
  const s = S.createGame(a, b, seed);
  s.__cardIndex = cards.byName; s.__tokenIndex = cards.byName;
  AI.applyMulligan(s, 0); AI.applyMulligan(s, 1);
  let g = 0, crash = null;
  try {
    while (s.winner == null && g < 80) {
      E.startTurn(s); if (s.winner != null) break;
      AI.takeTurn(s, s.active); if (s.winner != null) break;
      E.endTurn(s); g++;
    }
  } catch (e) { crash = e.message; }
  return { winner: s.winner, turn: s.turn, crash };
}

async function runMatrix() {
  runButton.disabled = true; statusEl.textContent = '加载卡表…';
  try {
    cards = await loadCards('ALL');
    const seeds = Math.max(1, Math.min(10, Number(seedInput.value) || 10));
    const names = listDecks(cards), old = [];
    for (const cls of ['毁灭','存护丰饶','巡猎','智识','同谐','虚无','欢愉','记忆']) {
      for (const dk of names[cls] || []) old.push({ cls, dk, deck: buildDeckFor(cards, cls, dk, S.makeRng(1)) });
    }
    const rows = [];
    for (const dk of names['崩坏'] || []) {
      statusEl.textContent = `正在运行 ${dk}…`;
      await new Promise(resolve => setTimeout(resolve, 0));
      const nd = buildDeckFor(cards, '崩坏', dk, S.makeRng(1)), byOpp = {};
      let w = 0, l = 0, u = 0, c = 0, turns = 0;
      let firstW = 0, firstL = 0, secondW = 0, secondL = 0;
      for (let oi = 0; oi < old.length; oi++) {
        const od = old[oi];
        for (const first of [0, 1]) for (let seed = 1; seed <= seeds; seed++) {
          const gameSeed = 710000 + oi * 10000 + first * 1000 + seed * 97;
          const r = first === 0 ? one(nd, od.deck, gameSeed) : one(od.deck, nd, gameSeed);
          const key = `${od.cls}｜${od.dk}`, z = byOpp[key] ||= { w: 0, l: 0, u: 0, c: 0, n: 0 };
          z.n++;
          if (r.crash) { c++; z.c++; }
          else if (r.winner == null) { u++; z.u++; }
          else if (r.winner === (first === 0 ? 0 : 1)) {
            w++; z.w++; if (first === 0) firstW++; else secondW++;
          } else {
            l++; z.l++; if (first === 0) firstL++; else secondL++;
          }
          turns += r.turn;
        }
      }
      rows.push({ deck: dk, wins: w, losses: l, undecided: u, crashes: c, total: w + l + u + c,
        winRate: w + l ? +(w / (w + l) * 100).toFixed(2) : 0,
        firstWinRate: firstW + firstL ? +(firstW / (firstW + firstL) * 100).toFixed(2) : 0,
        secondWinRate: secondW + secondL ? +(secondW / (secondW + secondL) * 100).toFixed(2) : 0,
        avgTurn: +(turns / (w + l + u + c)).toFixed(2), opponents: byOpp });
    }
    window.__finalMatrix = rows; outputEl.textContent = JSON.stringify(rows, null, 2); statusEl.textContent = '完成';
  } catch (e) {
    statusEl.textContent = '失败：' + e.message; window.__finalError = e.message;
  }
  runButton.disabled = false;
}

runButton.onclick = runMatrix;
const q = new URLSearchParams(location.search);
if (q.has('seeds')) seedInput.value = q.get('seeds');
if (q.get('auto') === '1') runMatrix();
</script></body></html>
