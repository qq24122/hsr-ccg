<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>崩铁 CCG — 崩坏职业专项测试</title><style>body{font:14px/1.7 sans-serif;margin:24px;background:#1a1c22;color:#ddd}.sum{padding:10px;border-radius:6px;font-weight:bold}.pass{background:#1d3a24;color:#8ce99a}.fail{background:#3a1d1d;color:#ff8787}table{border-collapse:collapse;width:100%}td{padding:6px 10px;border-bottom:1px solid #2c2f38}.ok{color:#8ce99a}.no{color:#ff8787}.err{color:#ffa8a8;font-size:12px}</style></head><body><h1>崩坏职业专项测试</h1><div id="summary" class="sum">运行中…</div><table id="rows"></table><script type="module">import {runHonkai} from './honkai-cases.js';const r=await runHonkai();const f=r.filter(x=>!x.ok);summary.className='sum '+(f.length?'fail':'pass');summary.textContent=`${r.length-f.length} / ${r.length} 通过`+(f.length?`，${f.length} 个失败`:'，全部通过');rows.innerHTML=r.map(x=>`<tr><td class="${x.ok?'ok':'no'}">${x.ok?'✓':'✗'}</td><td>${x.name}${x.ok?'':`<div class="err">${x.err}</div>`}</td></tr>`).join('');window.__result={pass:r.length-f.length,fail:f.length,total:r.length,failures:f};</script></body></html>
