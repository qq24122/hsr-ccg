<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>崩坏三套牌逐卡诊断</title></head><body><button id="run">运行</button><pre id="out"></pre><script type="module">
import{loadCards,buildDeckFor,listDecks}from'../src/loader.js';import*as S from'../src/state.js';import*as E from'../src/engine.js';import*as AI from'../src/ai.js?v=honkai-ai-4';let cards;const $=id=>document.getElementById(id);
function one(d0,d1,seed,h){const s=S.createGame(d0,d1,seed);s.__cardIndex=cards.byName;s.__tokenIndex=cards.byName;AI.applyMulligan(s,0);AI.applyMulligan(s,1);s.__aiTrace=[];s.__cardTrace=s.players.flatMap((p,player)=>p.hand.map(inst=>({turn:0,kind:'draw',player,uid:inst.uid,cardId:inst.def.id,name:inst.def.name,zone:'hand'})));let g=0;try{while(s.winner==null&&g<80){E.startTurn(s);if(s.winner!=null)break;AI.takeTurn(s,s.active);if(s.winner!=null)break;E.endTurn(s);g++}}catch(e){return{crash:e.message}}const by={};for(const e of s.__cardTrace.filter(x=>x.player===h)){const z=by[e.cardId]||={draw:0,play:0,discard:0,burn:0};if(e.kind==='draw')z.draw++;if(e.kind==='play')z.play++;if(e.kind==='discard')z.discard++;if(e.zone==='burned')z.burn++}for(const x of s.players[h].hand){const z=by[x.def.id]||={draw:0,play:0,discard:0,burn:0};z.end=(z.end||0)+1}return{winner:s.winner,by,modes:s.__aiTrace.filter(x=>x.player===h&&x.kind==='play-choice'&&x.chosen).map(x=>x.mode||'normal')}}
run.onclick=async()=>{run.disabled=true;cards=await loadCards('ALL');const names=listDecks(cards),old=[];for(const cls of['毁灭','存护丰饶','巡猎','智识','同谐','虚无','欢愉','记忆'])for(const dk of names[cls]||[])old.push({dk,deck:buildDeckFor(cards,cls,dk,S.makeRng(1))});const rows=[];for(const dk of names['崩坏']||[]){const nd=buildDeckFor(cards,'崩坏',dk,S.makeRng(1)),agg={},modes={};let w=0,l=0;for(const od of old)for(const f of[0,1]){const r=f===0?one(nd,od.deck,29,0):one(od.deck,nd,29,1);if(r.winner===(f===0?0:1))w++;else l++;for(const[k,z]of Object.entries(r.by||{})){const a=agg[k]||={draw:0,play:0,end:0};for(const q of['draw','play','end'])a[q]+=z[q]||0}for(const x of r.modes||[])modes[x]=(modes[x]||0)+1}const cardRows=Object.entries(agg).map(([id,z])=>({id,name:cards.byId[id]?.name,draw:z.draw,play:z.play,end:z.end,playRate:z.draw?Math.round(z.play/z.draw*100):0,endRate:z.draw?Math.round(z.end/z.draw*100):0})).filter(x=>cards.byId[x.id]?.class==='崩坏').sort((a,b)=>a.playRate-b.playRate);rows.push({deck:dk,w,l,modes,cards:cardRows})}out.textContent=JSON.stringify(rows,null,2);window.__carddiag=rows;run.disabled=false};
</script></body></html>
