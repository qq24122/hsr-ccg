<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 312" width="200" height="312">
<defs>
<radialGradient id="g" cx="50%" cy="38%" r="82%">
  <stop offset="0" stop-color="#77401a"/><stop offset="1" stop-color="#1f1108"/>
</radialGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<!-- 底 -->
<rect width="200" height="312" fill="url(#g)"/>
<!-- 外框：卡背的镶边 -->
<rect x="6" y="6" width="188" height="300" rx="8" fill="none"
      stroke="#ffb85c" stroke-width="2.4" opacity=".55"/>
<rect x="11" y="11" width="178" height="290" rx="6" fill="none"
      stroke="#ffb85c" stroke-width="0.8" opacity=".28"/>
<!-- 四角装饰 -->
<g stroke="#ffb85c" stroke-width="2" fill="none" opacity=".7">
  <path d="M19 19 L34 19 L34 34"/><path d="M181 19 L166 19 L166 34"/>
  <path d="M19 293 L34 293 L34 278"/><path d="M181 293 L166 293 L166 278"/>
</g>
<!-- 中心徽记 -->
<g transform="translate(100 156) scale(1.08) translate(-50 -50)"
   stroke="#ffb85c" stroke-width="4" fill="none" stroke-linejoin="round"
   stroke-linecap="round" opacity=".9" filter="url(#glow)"><path d="M16 40 Q50 14 84 40 Q79 76 50 90 Q21 76 16 40 Z"/><ellipse cx="36" cy="50" rx="6" ry="8"/><ellipse cx="64" cy="50" rx="6" ry="8"/><path d="M39 70 Q50 79 61 70"/></g>
<!-- 命途名（徽记上方） -->
<text x="100" y="227" text-anchor="middle"
      fill="#ffb85c" font-size="13" font-weight="bold"
      opacity=".75" letter-spacing="3">欢愉</text>
<!-- 卡组名（底部横栏） -->
<rect x="16" y="254" width="168" height="38" rx="5"
      fill="#24140c" stroke="#ffb85c" stroke-width="1.5" opacity=".85"/>
<text x="100" y="279" text-anchor="middle"
      fill="#ffb85c" font-size="17" font-weight="bold"
      opacity=".95" letter-spacing="2">大吉大利</text>
<!-- 副标题 -->
<text x="100" y="305" text-anchor="middle"
      fill="#ffb85c" font-size="9" opacity=".45" letter-spacing="1">随机伤害高方差</text>
</svg>
